<!DOCTYPE html>
<html lang="en" data-bs-theme="light">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Web Tech Quiz</title>
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdnjs.cloudflare.com/ajax/libs/bootstrap-icons/1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container py-3 py-md-4 app-wrap">

    <div class="d-flex justify-content-between align-items-center mb-3">
      <button id="themeBtn" class="btn btn-outline-secondary btn-sm rounded-circle theme-btn" aria-label="Toggle dark / light mode">
        <i class="bi bi-sun-fill" id="themeIcon"></i>
      </button>
      <h1 class="h5 m-0 fw-semibold">Web Technologies Quiz</h1>
      <span style="width:32px"></span>
    </div>

    <!-- Segmented progress bar -->
    <div id="progressBar" class="segbar mb-3" role="progressbar" aria-label="Quiz progress"></div>

    <!-- Quiz card -->
    <div id="quizCard" class="card shadow-sm border-0">
      <div class="card-body p-3 p-md-4">
        <div class="d-flex justify-content-between align-items-center mb-2">
          <span id="qCount" class="fs-6">Question 1 / 5</span>
          <span id="timer" class="fw-bold timer">Time Left: 15s</span>
        </div>
        <h2 id="qText" class="h4 fw-bold mb-4"></h2>
        <div id="options" class="d-grid gap-3"></div>
        <div class="text-center mt-4">
          <button id="nextBtn" class="btn btn-success px-4" disabled>Next <i class="bi bi-arrow-right"></i></button>
        </div>
      </div>
    </div>

    <!-- Result card -->
    <div id="resultCard" class="card shadow-sm border-0 d-none">
      <div class="card-body p-3 p-md-4">
        <h2 class="h3 fw-bold">Quiz Result</h2>
        <p id="scoreText" class="fs-5 mb-3"></p>
        <div class="table-responsive">
          <table class="table align-middle result-table">
            <thead>
              <tr><th>#</th><th>Question</th><th>Your Answer</th><th>Correct Answer</th><th>Status</th></tr>
            </thead>
            <tbody id="resultBody"></tbody>
          </table>
        </div>
        <div class="d-flex flex-wrap gap-2 justify-content-center mt-3">
          <button id="pdfBtn" class="btn btn-primary"><i class="bi bi-file-earmark-pdf"></i> Download PDF</button>
          <button id="restartBtn" class="btn btn-outline-secondary"><i class="bi bi-arrow-repeat"></i> Try Again</button>
        </div>
      </div>
    </div>

  </div>

  <script src="https://cdnjs.cloudflare.com/ajax/libs/bootstrap/5.3.3/js/bootstrap.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf-autotable/3.8.2/jspdf.plugin.autotable.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
